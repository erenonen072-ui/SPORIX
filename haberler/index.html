
<section class="sporix-news">
  <div class="news-top">
    <div>
      <h2>Son Spor Haberleri</h2>
      <p>Güncel spor gelişmeleri ve futbol gündemi</p>
    </div>
    <span id="newsUpdated">Haberler yükleniyor...</span>
  </div>

  <div id="newsStatus" class="news-status">
    Haberler getiriliyor...
  </div>

  <div id="newsList" class="news-grid"></div>
</section>

<style>
  .sporix-news {
    margin: 25px 0 45px;
  }

  .news-top {
    display: flex;
    align-items: end;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 20px;
  }

  .news-top h2 {
    margin: 0 0 6px;
    font-size: 23px;
    color: #171717;
  }

  .news-top p,
  #newsUpdated {
    margin: 0;
    color: #777;
    font-size: 13px;
  }

  .news-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 18px;
  }

  .news-card {
    overflow: hidden;
    background: #fff;
    border: 1px solid #e8e8e8;
    border-radius: 12px;
    transition: transform .2s, box-shadow .2s;
  }

  .news-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(0,0,0,.07);
  }

  .news-card a {
    color: inherit;
    text-decoration: none;
  }

  .news-image {
    width: 100%;
    height: 185px;
    object-fit: cover;
    display: block;
    background: #f0f2f5;
  }

  .news-no-image {
    height: 185px;
    display: grid;
    place-items: center;
    background: #f0f2f5;
    color: #8a8f98;
    font-size: 42px;
  }

  .news-content {
    padding: 15px;
  }

  .news-meta {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
    color: #777;
    font-size: 12px;
  }

  .news-source {
    color: #e50914;
    font-weight: 800;
  }

  .news-content h3 {
    margin: 0 0 9px;
    color: #202124;
    font-size: 16px;
    line-height: 1.45;
  }

  .news-content p {
    margin: 0;
    color: #737373;
    font-size: 13px;
    line-height: 1.6;
  }

  .news-status {
    padding: 18px;
    margin-bottom: 16px;
    border-radius: 9px;
    background: #f5f6f8;
    color: #555;
    font-size: 14px;
  }

  .news-status:empty {
    display: none;
  }

  @media (max-width: 850px) {
    .news-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }

  @media (max-width: 560px) {
    .news-grid {
      grid-template-columns: 1fr;
    }

    .news-image,
    .news-no-image {
      height: 210px;
    }

    .news-top {
      align-items: start;
      flex-direction: column;
    }
  }
</style>

<script>
(async function loadSporixNews() {
  const list = document.getElementById("newsList");
  const status = document.getElementById("newsStatus");
  const updated = document.getElementById("newsUpdated");

  if (!list || !status) return;

  function formatDate(value) {
    if (!value) return "Tarih belirtilmemiş";

    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return "Tarih belirtilmemiş";

    return new Intl.DateTimeFormat("tr-TR", {
      day: "2-digit",
      month: "short",
      hour: "2-digit",
      minute: "2-digit"
    }).format(date);
  }

  function createCard(news) {
    const article = document.createElement("article");
    article.className = "news-card";

    const link = document.createElement("a");
    link.href = news.link;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.setAttribute("aria-label", news.title);

    if (news.image) {
      const img = document.createElement("img");
      img.className = "news-image";
      img.src = news.image;
      img.alt = news.title;
      img.loading = "lazy";
      img.referrerPolicy = "no-referrer";

      img.addEventListener("error", () => {
        const fallback = document.createElement("div");
        fallback.className = "news-no-image";
        fallback.textContent = "⚽";
        img.replaceWith(fallback);
      });

      link.appendChild(img);
    } else {
      const fallback = document.createElement("div");
      fallback.className = "news-no-image";
      fallback.textContent = "⚽";
      link.appendChild(fallback);
    }

    const content = document.createElement("div");
    content.className = "news-content";

    const meta = document.createElement("div");
    meta.className = "news-meta";

    const source = document.createElement("span");
    source.className = "news-source";
    source.textContent = news.source || "Haber kaynağı";

    const date = document.createElement("span");
    date.textContent = formatDate(news.date);

    meta.append(source, date);

    const title = document.createElement("h3");
    title.textContent = news.title;

    const description = document.createElement("p");
    description.textContent =
      news.description || "Haberi kaynağında okumak için tıklayın.";

    content.append(meta, title, description);
    link.appendChild(content);
    article.appendChild(link);

    return article;
  }

  try {
    const response = await fetch("/api/news", {
      headers: { "Accept": "application/json" }
    });

    if (!response.ok) {
      throw new Error("Haber servisi şu anda yanıt vermiyor.");
    }

    const data = await response.json();

    if (!data.success || !data.items?.length) {
      throw new Error(data.message || "Henüz haber bulunamadı.");
    }

    list.replaceChildren(
      ...data.items.map(createCard)
    );

    status.textContent = "";
    updated.textContent =
      "Son kontrol: " + formatDate(data.updatedAt);

  } catch (error) {
    status.textContent =
      "Haberler şu anda yüklenemedi. Lütfen biraz sonra tekrar dene.";
    updated.textContent = "";
    console.error("SPORIX haber hatası:", error);
  }
})();
</script>
