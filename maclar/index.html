
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Canlı Skorlar | SPORIX</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/app.js" defer></script>
</head>
<body>
<header class="header">
  <div class="header-inner">
    <a href="/" class="logo"><img src="/images/logo.jpeg" alt="SPORIX"><span>SPOR<span>IX</span></span></a>
    <button class="menu-btn" id="menuBtn">☰</button>
    <nav class="nav" id="mainNav">
      <a href="/">Ana Sayfa</a>
      <a class="active" href="/maclar/">Canlı Skorlar</a>
      <a href="/haberler/">Haberler</a>
      <a href="/puan-durumu/">Puan Durumu</a>
      <a href="/fikstur/">Fikstür</a>
    </nav>
  </div>
</header>

<main class="container">
  <div class="page-title">
    <h1>Canlı Skorlar</h1>
    <p>Ligleri seç, karşılaşmaları ve maç sonuçlarını takip et.</p>
  </div>

  <div class="match-box">
    <div class="match-toolbar">
      <div class="toolbar-title">
        <strong id="matchDate">Günün Maçları</strong>
        <span>Karşılaşmalar</span>
      </div>
      <div class="toolbar-actions">
        <select id="leagueSelect" class="league-select">
          <option value="super-lig">Türkiye Süper Lig</option>
          <option value="1-lig">Türkiye 1. Lig</option>
          <option value="premier-league">Premier League</option>
          <option value="la-liga">La Liga</option>
          <option value="serie-a">Serie A</option>
          <option value="bundesliga">Bundesliga</option>
          <option value="ligue-1">Ligue 1</option>
          <option value="champions-league">Şampiyonlar Ligi</option>
        </select>
        <button id="refreshMatches" class="refresh-btn" type="button">↻</button>
      </div>
    </div>

    <div class="filters">
      <button class="filter-button active" data-filter="all">Tümü</button>
      <button class="filter-button" data-filter="live">Canlı</button>
      <button class="filter-button" data-filter="finished">Biten</button>
      <button class="filter-button" data-filter="upcoming">Yaklaşan</button>
    </div>

    <div id="matches" class="matches-list">
      <div class="loading-state">Maçlar yükleniyor...</div>
    </div>

    <div class="box-footer">
      <a href="/">Ana sayfaya dön</a>
      <small>Veri sağlayıcı: <a href="https://sportscore.com/" target="_blank" rel="dofollow">SportScore</a></small>
    </div>
  </div>
</main>

<footer class="footer"><div class="footer-inner">
  <a href="/" class="footer-logo">SPOR<span>IX</span></a>
  <div class="footer-links"><a href="/">Ana Sayfa</a><a href="/haberler/">Haberler</a><a href="/puan-durumu/">Puan Durumu</a><a href="/fikstur/">Fikstür</a></div>
  <small>© 2026 SPORIX</small>
</div></footer>

<script>
  const savedLeague = sessionStorage.getItem("sporix-selected-league");
  const select = document.getElementById("leagueSelect");
  if (savedLeague && select) {
    select.value = savedLeague;
    sessionStorage.removeItem("sporix-selected-league");
    select.dispatchEvent(new Event("change"));
  }
</script>
</body>
</html>
